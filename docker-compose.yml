# docker-compose.yml
# --------------------
# Spins up Postgres and Redis as containers so you don't have to install
# them directly on your machine. FastAPI itself still runs locally with
# uvicorn for now -- that makes it easier to see errors and auto-reload on
# save while you're learning.
#
# Start both containers:   docker compose up -d
# Stop them:                docker compose down
# See logs:                 docker compose logs -f

services:
  db:
    image: postgres:16
    container_name: pingme_db
    restart: always
    environment:
      POSTGRES_USER: pingme
      POSTGRES_PASSWORD: pingme
      POSTGRES_DB: pingme_db
    ports:
      - "5432:5432"
    volumes:
      - pingme_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: pingme_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  pingme_pgdata:
    # This named volume is what keeps your database data safe even if you
    # stop or restart the container -- without it, every restart would
    # wipe your data clean.

# ==============================================================================
# ROLE OF THIS FILE:
# Defines the Postgres and Redis containers PingMe depends on, and how they
# talk to your machine (via the ports mapping). Redis isn't actually used by
# any code yet in Phase 1 -- it's here now so Phase 2/3 (caching + Celery)
# can plug straight in without you having to revisit this file.
# ==============================================================================
