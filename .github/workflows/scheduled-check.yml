name: Scheduled trigger check

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes
  workflow_dispatch:          # lets you also trigger it manually from the Actions tab

jobs:
  check-all:
    runs-on: ubuntu-latest
    steps:
      - name: Hit /internal/check-all
        run: |
          curl -X POST "${{ secrets.PINGME_API_URL }}/internal/check-all" \
            -H "X-Internal-Secret: ${{ secrets.INTERNAL_CRON_SECRET }}" \
            --max-time 60 \
            --fail